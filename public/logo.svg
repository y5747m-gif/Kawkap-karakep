<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">شعار كوكب كراكيب</title>
  <desc id="desc">صندوق يدور حوله مسار ذهبي وأسهم إعادة استخدام خضراء على هيئة كوكب</desc>
  <defs>
    <linearGradient id="green" x1="94" y1="82" x2="402" y2="424" gradientUnits="userSpaceOnUse">
