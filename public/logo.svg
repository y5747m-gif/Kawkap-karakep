    <linearGradient id="gold" x1="58" y1="338" x2="456" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ee9f22"/><stop offset=".5" stop-color="#ffc44d"/><stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="205" y1="217" x2="307" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d89542"/><stop offset="1" stop-color="#a95f23"/>
